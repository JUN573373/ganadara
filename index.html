<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="기관별 발주를 조회하고 엑셀로 내려받는 발주체크 도구" />
    <title>발주체크</title>
    <script type="module" src="/src/theme.js"></script>
  </head>
  <body>
    <header class="header">
      <div class="header-inner">
        <a class="brand" href="./"><span class="brand-mark" aria-hidden="true">ㅂ</span>발주체크</a>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false">
          <svg class="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M20.8 13A9 9 0 0 1 11 3.2 9 9 0 1 0 20.8 13Z"/></svg>
          <span id="theme-label">다크 모드</span>
        </button>
      </div>
    </header>

    <main class="container">
      <div class="page-heading">
        <div><p class="eyebrow">발주 수집</p><h1>필요한 발주를 한 번에.</h1><p class="intro">기관과 조회 기간을 선택하면 발주 내용을 모아드립니다.</p></div>
        <span id="run-status" class="status-pill" role="status">대기 중</span>
      </div>

      <form id="scrape-form">
        <fieldset id="settings">
          <legend class="sr-only">발주 수집 설정</legend>
          <div class="settings-grid">
            <section class="panel" aria-labelledby="accounts-title">
              <div class="section-heading"><span class="step">01</span><h2 id="accounts-title">기관 계정</h2></div>
              <p class="section-description">수집할 기관을 선택하고 계정을 입력해 주세요.</p>
              <div class="accounts">
                <article class="account-card" data-site="ini">
                  <label class="institution"><input type="checkbox" name="site" value="ini" checked /><span>아이니웨딩<small>prm.iniwedding.com</small></span><span class="site-tag">선택됨</span></label>
                  <fieldset class="credentials">
                    <legend class="sr-only">아이니웨딩 계정</legend>
                    <label for="ini-id">아이디<input id="ini-id" name="ini-id" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="기관 아이디" required /></label>
                    <label for="ini-password">비밀번호<input id="ini-password" name="ini-password" type="password" autocomplete="off" placeholder="기관 비밀번호" required /></label>
                  </fieldset>
                </article>
                <article class="account-card is-unselected" data-site="swed">
                  <label class="institution"><input type="checkbox" name="site" value="swed" /><span>S웨딩<small>prm.s-wed.co.kr</small></span><span class="site-tag">선택 안 함</span></label>
                  <fieldset class="credentials" disabled>
                    <legend class="sr-only">S웨딩 계정</legend>
                    <label for="swed-id">아이디<input id="swed-id" name="swed-id" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="기관 아이디" required /></label>
                    <label for="swed-password">비밀번호<input id="swed-password" name="swed-password" type="password" autocomplete="off" placeholder="기관 비밀번호" required /></label>
                  </fieldset>
                </article>
              </div>
              <p class="field-note">계정은 저장하지 않습니다. 수집 시작 후 로그인부터 진행합니다.</p>
            </section>

            <section class="panel" aria-labelledby="options-title">
              <div class="section-heading"><span class="step">02</span><h2 id="options-title">조회 설정</h2></div>
              <p class="section-description">원하는 발주 유형과 기간을 지정해 주세요.</p>
              <div class="options">
                <label for="order-type">발주 유형<select id="order-type" name="order-type"><option value="WMON">본식 · 예식일 기준</option><option value="RMON">촬영 · 리허설일 기준</option></select></label>
                <label for="date-preset">조회 기간<select id="date-preset"><option value="legacy">기본 기간 · 6일 전부터 내일까지</option><option value="today">오늘</option><option value="week">최근 7일 · 오늘 포함</option><option value="custom">직접 지정</option></select></label>
                <div class="date-fields">
                  <label for="start-date">시작일<input id="start-date" name="start-date" type="date" required /></label>
                  <span class="date-separator" aria-hidden="true">—</span>
                  <label for="end-date">종료일<input id="end-date" name="end-date" type="date" required /></label>
                </div>
                <label class="check-option"><input id="only-unconfirmed" type="checkbox" checked /><span>확인 완료 발주를 만나면 수집 종료<small>해제하면 확인 완료 발주도 포함합니다.</small></span></label>
              </div>
              <div class="request-footer">
                <p id="form-error" class="form-error" role="alert" hidden></p>
                <button id="start-button" class="button primary" type="submit"><span id="start-spinner" class="spinner" hidden aria-hidden="true"></span><span id="start-label">발주 수집 시작</span><span aria-hidden="true">↗</span></button>
                <p class="field-note">진행 상황과 오류는 아래 로그에 표시됩니다.</p>
              </div>
            </section>
          </div>
        </fieldset>
      </form>

      <section class="terminal" aria-labelledby="logs-title">
        <div class="terminal-toolbar">
          <div class="terminal-title"><span class="terminal-dot" aria-hidden="true"></span><h2 id="logs-title">실행 로그</h2><span id="log-count">1</span></div>
          <div class="terminal-actions">
            <label class="auto-scroll"><input id="auto-scroll" type="checkbox" checked />자동 스크롤</label>
            <button id="clear-logs" type="button">지우기</button>
            <button id="cancel-button" type="button" disabled>수집 중지</button>
          </div>
        </div>
        <div id="logs" class="log-output" role="log" aria-live="polite" aria-relevant="additions" tabindex="0" aria-label="발주 수집 실행 로그"></div>
        <div class="terminal-footer"><span id="progress-text">설정을 마치고 발주 수집을 시작해 주세요.</span><span id="row-count">수집 0건</span></div>
      </section>

      <section id="result-panel" class="result-panel" aria-labelledby="result-title" hidden>
        <div><h2 id="result-title">수집 결과</h2><p id="result-summary"></p></div>
        <button id="download-button" class="button primary" type="button">엑셀 다운로드 <span aria-hidden="true">↓</span></button>
      </section>
      <footer class="page-footer"><span>발주체크</span><span>기관 선택부터 엑셀 저장까지.</span></footer>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
